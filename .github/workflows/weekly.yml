name: Weekly US macro refresh and dashboard

on:
  schedule:
    # Monday 00:00 UTC = Monday 08:00 Hong Kong; Hong Kong has no DST.
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'src/data.json', '**.md']

permissions:
  contents: read

concurrency:
  group: macro-refresh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      refresh_status: ${{ steps.refresh.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            updater/requirements.txt
            ml/requirements.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install and verify
        run: |
          npm ci
          python -m pip install -r updater/requirements.txt -r ml/requirements.txt
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/macro.test.mjs
      - name: Refresh sources and export
        id: refresh
        shell: bash
        run: |
          python updater/bootstrap.py
          set +e
          python updater/update_us_macro.py
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then exit "$result"; fi
          python updater/export_data.py
          echo "status=$result" >> "$GITHUB_OUTPUT"
      - name: Verify Python and R preparation
        run: |
          python ml/prepare_python.py
          Rscript ml/prepare_R.R
          python tests/compare_languages.py
      - name: Build dashboard
        run: |
          npm run build
          mkdir -p dist/data
          cp data/us_macro.xlsx data/observations.csv data/dictionary.csv data/dictionary.json data/revisions.csv data/refresh_log.csv data/refresh_status.json dist/data/
          touch dist/.nojekyll
      - name: Retain history and revised values
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/us_macro.xlsx data/latest_snapshot.json data/raw data/*.csv data/*.json src/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh US macro data and source vintages [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: us-macro-excel-and-model-inputs
          path: |
            data/us_macro.xlsx
            data/*.csv
            data/refresh_status.json
            ml/output/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source failures after preserving valid data
        if: needs.build.outputs.refresh_status == '2'
        run: |
          echo 'Some sources failed; previous valid data was retained. Inspect data/refresh_status.json.'
          exit 1
