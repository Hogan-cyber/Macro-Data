[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hogan-macro-data"
version = "0.1.0"
description = "Verified Python access to the Hogan global macro and market dataset"
readme = "PACKAGE_GUIDE.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3.1", "certifi>=2024.2.2"]
authors = [{name = "Hogan"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]

[project.urls]
Repository = "https://github.com/Hogan-cyber/Macro-Data"
Documentation = "https://github.com/Hogan-cyber/Macro-Data/blob/main/PACKAGE_GUIDE.md"

[tool.setuptools.packages.find]
where = ["python"]

